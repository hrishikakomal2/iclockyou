<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Clock You</title>
<meta name="theme-color" content="#0F1D24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="I Clock You">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one phone column. Teal is you, persimmon is your partner, a split dot is the two of you. Times are set large in the display face; everything else stays quiet. */
:root{
  --bg:#F4F3F1;--surface:#FFFFFF;--surface-2:#EAE8E4;--ink:#14202A;--ink-2:#55606A;--line:#DEDBD6;
  --you:#0B7A75;--you-soft:#D8EEEA;--them:#C8501F;--them-soft:#F8E3D8;--danger:#B3261E;--danger-soft:#F9DEDC;--ok:#1F7A3D;
  --on-you:#FFFFFF;--on-them:#FFFFFF;--scrim:rgba(10,20,26,.5);--shadow:0 12px 32px -14px rgba(20,32,42,.32);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E191E;--surface:#15242A;--surface-2:#1D2F36;--ink:#E9F0F1;--ink-2:#9FB2B9;--line:#26383F;
  --you:#3CC4BB;--you-soft:#113A3A;--them:#FF8A5B;--them-soft:#3A2218;--danger:#FF8B84;--danger-soft:#3C1E1D;--ok:#67D28B;
  --on-you:#062321;--on-them:#2A1005;--scrim:rgba(0,0,0,.62);--shadow:0 12px 32px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E191E;--surface:#15242A;--surface-2:#1D2F36;--ink:#E9F0F1;--ink-2:#9FB2B9;--line:#26383F;
  --you:#3CC4BB;--you-soft:#113A3A;--them:#FF8A5B;--them-soft:#3A2218;--danger:#FF8B84;--danger-soft:#3C1E1D;--ok:#67D28B;
  --on-you:#062321;--on-them:#2A1005;--scrim:rgba(0,0,0,.62);--shadow:0 12px 32px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
b,strong{font-weight:650}
.ic{display:block;flex:none}
.you{--c:var(--you);--cs:var(--you-soft);--oc:var(--on-you)}
.them{--c:var(--them);--cs:var(--them-soft);--oc:var(--on-them)}
.us{--c:var(--ink);--cs:var(--surface-2);--oc:var(--surface)}

/* stage and frame */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px}
.app{position:relative;width:min(100%,430px);height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;flex:none}
@media (min-width:640px) and (min-height:720px){.stage{padding:20px}.app{height:min(880px,100%);border-radius:40px;border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(16,34,43,.45)}}
.side{display:none}
@media (min-width:1100px) and (min-height:720px){
  .side{display:block;width:300px;max-height:100%;overflow-y:auto;padding:4px}
  .side h1{font:700 30px/1.05 var(--f-display);margin:10px 0 8px;letter-spacing:-.015em}
  .side p{margin:0 0 16px;color:var(--ink-2);font-size:14.5px}
}
.demo{display:grid;gap:12px;font-size:14px}
.demo h3{margin:0;font:650 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.demo .clk{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.demo .chips{display:flex;flex-wrap:wrap;gap:6px}
.demo .chips button{padding:7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;min-height:36px}
.demo .chips button:hover{border-color:var(--c,var(--you))}
.demo .chips button[aria-pressed="true"]{background:var(--c);color:var(--oc);border-color:var(--c)}

/* screens */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 28px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h1.title{font:700 30px/1.08 var(--f-display);letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
h2.sec{font:650 12px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;gap:10px}
.link{color:var(--you);font-weight:650;font-size:14px;padding:6px 0;min-height:32px}
.hbtns{display:flex;gap:4px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--ink);flex:none}
.ibtn:active{background:var(--surface-2)}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--them);border:2px solid var(--bg)}
.bar{display:flex;align-items:center;gap:4px;padding:10px 0 4px;margin-left:-10px}
.bar h1{font:650 20px/1.2 var(--f-display);margin:0;flex:1;letter-spacing:-.005em}
.sub{color:var(--ink-2);font-size:15px;margin:6px 0 0}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none;font:650 calc(var(--s)*.42)/1 var(--f-display);background:var(--cs);color:var(--c)}
.avp{display:flex}.avp .av{box-shadow:0 0 0 2px var(--surface)}.avp .av+.av{margin-left:-10px}
.sd{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--you) 50%,var(--them) 50%);flex:none;display:inline-block}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--ink-2);text-align:center;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:700;vertical-align:1px}
.cnt.them{background:var(--them);color:var(--on-them)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 14px}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;position:relative}
.rmain{flex:1;min-width:0;display:block;padding:2px 0}
.rt{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.rm{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;color:var(--ink-2);font-size:13px;margin-top:2px}
.row.done .rt{text-decoration:line-through;color:var(--ink-2)}
.ck{width:44px;height:44px;margin:-8px -8px -8px -12px;display:grid;place-items:center;flex:none}
.ck i{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:transparent}
.row.done .ck i{background:var(--c);color:var(--surface)}
.tm{font:600 17px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums;flex:none;min-width:54px}
.tm small{display:block;font:650 10px/1 var(--f-body);letter-spacing:.06em;color:var(--ink-2);margin-top:3px}
.rico{width:36px;height:36px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;flex:none;margin:0 -2px 0 -4px;font-size:18px}
.row.routine .rt{font-weight:500;color:var(--ink-2)}
.row.routine.now .rt{color:var(--ink);font-weight:650}
.row.past{opacity:.62}
.now-line{display:flex;align-items:center;gap:8px;color:var(--them);font:650 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.now-line::after{content:"";height:1.5px;background:var(--them);flex:1;opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.c{background:var(--cs);color:var(--c)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.pill{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.seen{background:var(--you-soft);color:var(--you)}.pill.snoozed,.pill.rescheduled{background:var(--them-soft);color:var(--them)}
.pill.done{background:var(--you-soft);color:var(--ok)}.pill.declined{background:var(--danger-soft);color:var(--danger)}

/* partner status card + prompts */
.pstat{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-top:8px}
.pstat .t1{font-weight:650}.pstat .t2{font-size:13px;color:var(--ink-2)}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:14px;box-shadow:var(--shadow);display:grid;gap:12px}
.prompt .ph{display:flex;align-items:center;gap:12px}
.prompt .pe{width:46px;height:46px;border-radius:15px;background:var(--you-soft);display:grid;place-items:center;font-size:24px;flex:none}
.prompt h3{font:650 19px/1.2 var(--f-display);margin:0}.prompt p{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtns button{flex:1 1 auto;min-height:48px;border-radius:14px;font-weight:650;background:var(--surface-2);text-align:center;padding:0 12px}
.pbtns button.p{background:var(--you);color:var(--on-you)}
.pnote{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-top:12px}
.ask-h{display:flex;align-items:center;gap:10px;background:var(--them-soft);padding:10px 14px;font-size:14px}
.ask-b{padding:12px 14px 4px}.ask-b .t{font:650 20px/1.2 var(--f-display);margin:0 0 3px}.ask-b .w{color:var(--ink-2);font-size:14px}
.acts{display:grid;grid-template-columns:1.1fr 1fr 1.15fr 1fr;gap:6px;padding:12px 10px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;font-size:12px;font-weight:650;background:var(--surface-2);min-height:56px;justify-content:center;text-align:center}
.act.pri{background:var(--them);color:var(--on-them)}.act.neg{color:var(--danger)}
.strip{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px}
.strip .ico{width:38px;height:38px;border-radius:12px;background:var(--you-soft);color:var(--you);display:grid;place-items:center;flex:none}
.strip .s1{font-weight:650}.strip .s2{font-size:13px;color:var(--ink-2)}

/* dashboard */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:10px;align-content:start}
.dc .dn{display:flex;align-items:center;gap:8px;font:650 17px var(--f-display)}
.dc .st{display:inline-flex;align-items:center;gap:6px;background:var(--cs);color:var(--c);border-radius:12px;padding:6px 10px;font-weight:650;font-size:14px;width:fit-content}
.dc .sti{font-size:12px;color:var(--ink-2);margin-top:-6px}
.dc ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14px}
.dc li{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.dc li span:first-child{color:var(--ink-2)}.dc li b{font-variant-numeric:tabular-nums;font-weight:650;font-size:13.5px;white-space:nowrap}
.dc .none{font-size:13px;color:var(--ink-2)}
.qm{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.qm::-webkit-scrollbar{display:none}
.qm button{flex:none;padding:10px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:44px}
.qm button:active{background:var(--them-soft)}
.uprow{display:flex;gap:12px;align-items:center;padding:11px 0}
.uprow .tm{min-width:58px;text-align:left}

.notes{columns:2;column-gap:10px}
.note{break-inside:avoid;display:block;width:100%;margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.note .nt{font:650 16px/1.25 var(--f-display);margin-bottom:6px;overflow-wrap:anywhere}
.note .nb{font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.note .nf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--ink-2);font-size:12px}
.ci{display:flex;align-items:center;gap:10px;padding:8px 0}
.ci .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent;flex:none}
.ci.done .bx{background:var(--them);border-color:var(--them);color:var(--on-them)}
.ci.done span{text-decoration:line-through;color:var(--ink-2)}
.ci button.bxb{width:44px;height:44px;margin:-9px -9px -9px -10px;display:grid;place-items:center}

.field{display:grid;gap:6px}.field>span,.lbl{font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid transparent;background:var(--surface-2);padding:10px 14px;font-size:16px;color:var(--ink)}
textarea{resize:none;line-height:1.5}
input.big{font:600 20px/1.3 var(--f-display);min-height:62px;padding:14px 16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--you);outline-offset:0;background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-weight:650;font-size:16px;background:var(--you);color:var(--on-you);text-align:center}
.btn.them{background:var(--them);color:var(--on-them)}.btn.sec{background:var(--surface-2);color:var(--ink)}.btn.bad{background:var(--danger-soft);color:var(--danger)}
.btn.sm{width:auto;min-height:44px;padding:0 16px;border-radius:14px;font-size:15px}
.btn:active{filter:brightness(.92)}.btns{display:flex;gap:8px}.btns>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;font-size:11px;font-weight:650;color:var(--ink-2);min-height:52px;justify-content:center;text-align:center}
.nav .pl{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.nav button[aria-current="page"]{color:var(--you)}.nav button[aria-current="page"] .pl{background:var(--you-soft)}
.nav .fabw{justify-content:flex-start}
.fab{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow);border:4px solid var(--surface)}
.badge{position:absolute;top:-3px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--them);color:var(--on-them);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:30px 24px;color:var(--ink-2)}
.empty .eic{width:60px;height:60px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;color:var(--you);margin-bottom:6px}
.empty b{color:var(--ink);font:650 18px/1.2 var(--f-display)}.empty p{margin:0;max-width:30ch;font-size:14.5px}
.tog{width:52px;height:32px;border-radius:16px;background:var(--surface-2);position:relative;flex:none;border:1.5px solid var(--line)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--you);border-color:var(--you)}.tog[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-you)}
.set{display:flex;align-items:center;gap:12px;padding:13px 0;min-height:56px}
.set .sl{flex:1;min-width:0}.set .s1{font-weight:600}.set .s2{font-size:13px;color:var(--ink-2);line-height:1.35}
.set select{width:auto;min-height:40px;padding:6px 10px;font-size:15px}.set input[type=time]{width:auto;min-height:40px}
.lvl{display:flex;background:var(--surface-2);border-radius:11px;padding:2px;gap:1px;flex:none}
.lvl button{padding:6px 9px;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--ink-2);min-height:32px;text-align:center}
.lvl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.lvl button[aria-pressed="true"].a{color:var(--you)}.lvl button[aria-pressed="true"].n{color:var(--danger)}
.hint{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:14px;padding:11px 13px}
.hint.them{background:var(--them-soft);color:var(--ink)}.hint.you{background:var(--you-soft);color:var(--ink)}
.dl>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;align-items:center}.dl>div+div{border-top:1px solid var(--line)}
.dl dt{color:var(--ink-2);font-size:14px}.dl dd{margin:0;font-weight:600;text-align:right}
.tl{margin:0;padding:0;list-style:none}.tl li{display:flex;gap:12px;padding:6px 0;font-size:14px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--them);margin-top:7px;flex:none}
.tl small{display:block;color:var(--ink-2);font-size:12px}
.pr{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%}.pr .sl{flex:1;min-width:0}.pr .s1{font-weight:600}.pr .s2{font-size:13px;color:var(--ink-2)}
.chev{color:var(--ink-2)}
.alarm{display:flex;align-items:center;gap:12px;padding:14px 0}
.alarm .at{font:600 42px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.alarm .at small{font:650 14px var(--f-body);letter-spacing:0;margin-left:4px;color:var(--ink-2)}
.alarm.off .at{color:var(--ink-2);opacity:.6}
.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
.wk button{display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:16px;font-size:11px;font-weight:650;color:var(--ink-2);min-height:64px}
.wk b{font:650 18px var(--f-display);color:var(--ink)}
.wk button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}.wk button[aria-pressed="true"] b{color:var(--surface)}
.wk .dots{display:flex;gap:3px;height:5px}.wk .dots i{width:5px;height:5px;border-radius:50%;background:var(--you)}.wk .dots i.t{background:var(--them)}
.dchips{display:flex;gap:6px}.dchips button{flex:1;height:44px;border-radius:12px;background:var(--surface-2);font-weight:650;text-align:center}
.dchips button[aria-pressed="true"]{background:var(--you);color:var(--on-you)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-radius:14px;background:var(--surface-2);font-weight:600;width:100%}

  const dates=S.dates.map(d=>{const [m,dd]=d.md.split('-').map(Number);let t=new Date(new Date(TODAY).getFullYear(),m-1,dd).getTime();if(t<TODAY)t=new Date(new Date(TODAY).getFullYear()+1,m-1,dd).getTime();return {...d,ts:t,n:Math.round((t-TODAY)/DAY)}}).sort((a,b)=>a.ts-b.ts);

    <div class="sec-h"><h2 class="sec">Shared tasks · ${tasks.length}</h2>${ro?'':`<button class="link" data-a="add" data-v="ours">Add</button>`}</div>
    ${tasks.length?`<div class="list">${tasks.map(r=>{const k=dk(r.at);const who=r.joint?r.for:r.for;return ro?`<div class="pr"><span class="rico">${ic('check',16)}</span><span class="sl"><div class="s1">${esc(r.title)}</div><div class="s2">${esc(nm(who))}</div></span></div>`:`<div class="row ${tn(who)}"><button class="ck" data-a="tick" data-id="${r.id}" data-k="${k}" aria-label="Mark done: ${esc(r.title)}"><i>${ic('check',16)}</i></button><button class="rmain" data-a="openrem" data-id="${r.id}" data-k="${k}"><div class="rt">${esc(r.title)}</div><div class="rm"><span class="chip c ${tn(who)}">${esc(nm(who))}</span><span>${whenTxt(r.at)}</span></div></button></div>`}).join('')}</div>`:empty('check','No shared tasks','Ask '+esc(nm(p))+' to remember something, or add a task for both of you.')}
    <div class="sec-h"><h2 class="sec">Shared notes and lists</h2>${ro?'':`<button class="link" data-a="notetab" data-v="ours">All</button>`}</div>
    ${notes.length?`<div class="list">${notes.map(n=>`<button class="pr" data-a="${ro?'none':'openNote'}" data-id="${n.id}"><span class="sl"><div class="s1">${esc(n.title)}</div><div class="s2">${n.items.length?n.items.filter(i=>!i.d).length+' left · ':''}${n.vis==='ours'?'Ours':'Shared by '+esc(nm(n.owner))} · ${n.by===V()?'edited by you':'edited by '+esc(nm(n.by))}</div></span>${ro?'':`<span class="chev">${ic('next',18)}</span>`}</button>`).join('')}</div>`:''}

    <div class="list" ${dates.length?'':'hidden'}>${dates.map(d=>`<div class="pr"><span class="rico" style="background:var(--surface-2);color:var(--ink)">${ic('cal',16)}</span><span class="sl"><div class="s1">${esc(d.t)}</div><div class="s2">${WD[new Date(d.ts).getDay()]} ${new Date(d.ts).getDate()} ${MO[new Date(d.ts).getMonth()].slice(0,3)}</div></span><b style="font-variant-numeric:tabular-nums">${d.n===0?'Today':d.n+' d'}</b></div>`).join('')}</div>`;
}

SCR.plan=()=>{
  const day=ui.sel,conn=isConn(),who=conn?ui.planWho:'mine';
  const ok=l=>who==='all'||(who==='mine'?l==='me':l!=='me');
  const showVis=conn&&who==='all';
  const ev=evOcc(day).filter(o=>ok(layerOfEv(o.e)));
  const rems=remOcc(day).filter(o=>ok(layerOfRem(o.r)));
  const wb=[];if(who!=='ours')wb.push(workBlock(V(),day));if(conn&&who!=='mine')wb.push(workBlock(PID(),day));
  const wk=[...Array(7)].map((_,i)=>TODAY+(i-new Date(TODAY).getDay()+1)*DAY);
  const all=[...ev.map(o=>({ts:o.ts,h:evRow(o,who==='ours',{vis:showVis})})),...rems.filter(o=>o.r.for===V()||o.r.joint||who!=='mine').map(o=>({ts:o.ts,h:remRow(o,{vis:showVis})}))].sort((a,b)=>a.ts-b.ts);
  const layerSeg=conn?`<div class="seg" style="margin-top:12px">${[['mine','Mine'],['ours','Ours'],['all','All']].map(([v,l])=>`<button data-a="planwho" data-v="${v}" aria-pressed="${ui.planWho===v}">${l}</button>`).join('')}</div>`:'';
  const filt=ui.remFilter;
  let rl=S.rems.filter(r=>remVisible(r)&&r.status!=='declined'&&ok(layerOfRem(r)));
  const isDoneR=r=>r.done[dk(r.at)]||r.status==='done';
  rl=filt==='done'?rl.filter(isDoneR):rl.filter(r=>!isDoneR(r));
  rl.sort((a,b)=>a.at-b.at);
  return `<div class="head"><div><div class="eyebrow">${ui.planTab==='schedule'?MO[new Date(day).getMonth()]+' '+new Date(day).getFullYear():'To do'}</div><h1 class="title">Plan</h1></div></div>
    ${seg('plantab',ui.planTab,[['schedule','Schedule'],['reminders','Reminders']])}${layerSeg}
    ${ui.planTab==='schedule'?`
    <div class="wk" role="group" aria-label="Week">${wk.map(d=>{const e=evOcc(d).filter(o=>ok(layerOfEv(o.e))).length+remOcc(d).filter(o=>ok(layerOfRem(o.r))).length;return `<button data-a="selday" data-v="${d}" aria-pressed="${d===day}" aria-label="${WDL[new Date(d).getDay()]} ${new Date(d).getDate()}">${WD[new Date(d).getDay()]}<b>${new Date(d).getDate()}</b><span class="dots">${e?'<i></i>':''}${conn&&evOcc(d).some(o=>o.e.owner!==V())?'<i class="t"></i>':''}</span></button>`}).join('')}</div>
    <div class="sec-h"><h2 class="sec">${dayLabel(day)}${conn?' · '+{mine:'Mine',ours:'Ours',all:'Mine and ours'}[who]:''}</h2><button class="link" data-a="add" data-v="event">Add event</button></div>
    ${wb.filter(Boolean).map(w=>`<div class="hint ${tn(w.uid)}" style="margin-bottom:8px;display:flex;gap:10px;align-items:center">${av(w.uid,24)}<span>${w.masked?'Busy':'Work'} · ${fmtT(w.s)} – ${fmtT(w.e)}</span></div>`).join('')}
    ${all.length?`<div class="list">${all.map(x=>x.h).join('')}</div>`:empty('cal','Nothing on '+WDL[new Date(day).getDay()],'Add an event or a reminder.')}`
    :`<div class="qm" style="margin-top:12px">${[['up','Upcoming'],['done','Done']].map(([v,l])=>`<button data-a="remf" data-v="${v}" style="${(filt==='done')===(v==='done')?'background:var(--ink);color:var(--surface)':''}">${l}</button>`).join('')}</div>
    <div style="margin-top:12px">${rl.length?`<div class="list">${rl.map(r=>remRow({r,k:dk(r.at),ts:r.moved[dk(r.at)]||r.at},{vis:showVis,day:true})).join('')}</div>`:empty('check','Nothing here',conn?'Try “Remind '+esc(nm(PID()))+' to buy groceries at 6 PM”.':'Try “Pay electricity bill tomorrow at 10 AM”.','<button class="btn sm" data-a="add" data-v="reminder">Add reminder</button>')}</div>`}`;
};

const noteVisible=n=>isConn()?(n.owner===V()||n.vis!=='me'):(n.owner===V()&&n.vis==='me');

SCR.reminder=r=>{
  const it=REM(r.id);if(!it)return bar('Reminder')+empty('x','This reminder is gone','It may have been deleted.');
  const k=r.k||dk(it.at),d=!!it.done[k],ts=it.moved[k]||it.at;

   <div style="padding:6px 0 14px">${incoming?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="them">${av(it.by,28)}</span><span class="chip c them">${esc(nm(it.by))} reminded you</span>${statusPill(it.status)}</div>`:''}${sent?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="them">${av(it.for,28)}</span><span class="chip c them">For ${esc(nm(it.for))}</span>${statusPill(it.status)}</div>`:''}

   ${incoming&&!d&&it.status!=='declined'?`<div class="card them" style="margin-top:14px;padding:0">${actions(it.id,k)}</div><p class="hint" style="margin-top:10px">${esc(nm(it.by))} will be told what you choose.</p>`:''}
   ${!incoming&&!sent?`<div class="btns" style="margin-top:14px"><button class="btn" data-a="tick" data-id="${it.id}" data-k="${k}">${ic('check',20)}${d?'Mark not done':'Done'}</button><button class="btn sec" data-a="snz" data-id="${it.id}" data-k="${k}">${ic('clock',20)}Snooze</button></div>`:''}
   ${it.log.length?`<div class="sec-h"><h2 class="sec">History</h2></div><div class="card"><ul class="tl">${[...it.log].reverse().map(l=>`<li><span>${esc(l.text)}<small>${dayLabel(l.t)}, ${fmtT(l.t)}</small></span></li>`).join('')}</ul></div>`:''}

   ${isConn()&&!incoming?`<div class="sec-h"><h2 class="sec">Who can see this?</h2></div>${visPickerHTML(layerOfRem(it),'reminder','remvis',`data-id="${it.id}"`)}`:''}
   ${!incoming?`<button class="btn bad" style="margin-top:12px" data-a="delrem" data-id="${it.id}">${ic('trash',20)}Delete</button>`:''}`;
};

  <div class="sec-h"><h2 class="sec">Alarms</h2></div>
  <button class="strip" style="margin-top:0" data-a="go" data-v="alarms"><span class="ico">${ic('alarm')}</span><span style="flex:1"><div class="s1">${S.alarms.filter(a=>a.user===V()).length} alarms</div><div class="s2">Wake-up, meetings, medication</div></span><span class="chev">${ic('next',18)}</span></button>`};

SCR.alarms=()=>{const na=nextAlarm(),al=S.alarms.filter(a=>a.user===V());
  return `${bar('Alarms',`<button class="btn sm" data-a="add" data-v="alarm" style="margin-right:-4px">${ic('plus',18)}Add</button>`)}
  <p class="sub" style="margin:2px 0 10px">${na?`Next rings in <b style="color:var(--ink)">${inTxt(na.ts-NOW())}</b>`:'No alarms are on.'}</p>
  ${al.length?`<div class="list">${al.map(a=>{const [t,ap]=fmtHM(a.time).split(' ');return `<div class="alarm ${a.on?'':'off'}"><button style="flex:1;display:block" data-a="ealarm" data-id="${a.id}" aria-label="Edit alarm ${t} ${ap} ${esc(a.label)}"><div class="at">${t}<small>${ap||''}</small></div><div class="rm" style="margin-top:6px"><span>${esc(a.label)}</span><span>·</span><span>${daysTxt(a.days)}</span></div></button>${tog('alarm:'+a.id,a.on,'Alarm '+t+' on')}</div>`}).join('')}</div>`:empty('alarm','No alarms yet','Add one for tomorrow morning.','<button class="btn sm" data-a="add" data-v="alarm">Add alarm</button>')}
  <div class="hint" style="margin-top:14px"><b>Alarm, reminder, event, check-in.</b> An alarm rings until you stop it and is only ever yours. A reminder is a quiet nudge about something to do${isConn()?`, and can be shared with ${esc(nm(PID()))}`:''}. An event is a block of time. A check-in is a question, like “Are you awake?”.</div>
  <button class="btn sec" style="margin-top:12px" data-a="ring" data-v="a1">${ic('play',18)}Preview an alarm ringing</button>`};
const daysTxt=d=>{const s=[...d].sort().join();if(!d.length)return'Once';if(d.length===7)return'Every day';if(s==='1,2,3,4,5')return'Weekdays';if(s==='0,6')return'Weekends';return d.slice().sort().map(x=>WD[x]).join(' ')};

SCR.privacy=()=>{const u=U(),p=nm(PID());
  if(S.mode==='single'||S.pstate==='none'&&false)return `${bar('Privacy')}<div class="hint you" style="display:flex;gap:10px"><span>${ic('shield',20)}</span><span><b>Everything in My Space is only yours.</b> Nothing is shared with anyone. If you later switch to Mingle, nothing is shared automatically.</span></div>
   <div class="sec-h"><h2 class="sec">Notifications</h2></div><div class="list"><div class="set"><span class="sl"><div class="s1">Hide text on lock screen</div><div class="s2">Shows “Reminder” instead of the title.</div></span>${tog('lockHide',S.set.lockHide,'Hide text on lock screen')}</div></div>
   <div class="sec-h"><h2 class="sec">Your data</h2></div><div class="list"><div class="pr"><span class="sl"><div class="s1">Export my data</div><div class="s2">Notes, reminders, routine</div></span><button class="link" data-a="exportdata">Export</button></div></div>
   <p class="hint" style="margin-top:12px">Location is not tracked, and isn't part of this app.</p>`;
  const rows=[...KIND_ORDER,'exercise'].filter(k=>k!=='exercise'||u.extra.length).map(k=>`<div class="set" style="flex-wrap:wrap"><span class="rico" style="background:var(--you-soft)">${KEMOJI[k]}</span><span class="sl"><div class="s1">${KLABEL[k]}</div></span>${lvl('rule',u.share[k],k)}</div>`).join('');
  return `${bar('Privacy')}
  ${!isConn()?`<div class="hint them" style="margin-bottom:12px">Sharing starts once ${esc(p)} joins. These settings are ready for that day.</div>`:''}
  <div class="hint you" style="display:flex;gap:10px"><span>${ic('shield',20)}</span><span><b>My Space is only yours.</b> ${esc(p)} sees only what you put in Our Space, share with ${esc(p)}, or allow below. ${esc(p)} is never told when you skip, ignore or don't answer.</span></div>
  <div class="sec-h"><h2 class="sec">New items start as</h2></div>
  <div class="list"><div class="set"><span class="sl"><div class="s1">Default visibility</div><div class="s2">Only me is the safest choice.</div></span><select data-in="defvis" aria-label="Default visibility"><option value="me" ${(u.defVis3||'me')==='me'?'selected':''}>Only me</option><option value="partner" ${u.defVis3==='partner'?'selected':''}>Share with ${esc(p)}</option><option value="ours" ${u.defVis3==='ours'?'selected':''}>Our Space</option></select></div></div>
  <div class="sec-h"><h2 class="sec">When you answer a check-in</h2></div>
  <div class="list">${rows}</div>
  <p style="font-size:13px;color:var(--ink-2);margin:8px 2px 0"><b style="color:var(--ink)">Always</b> shares right away. <b style="color:var(--ink)">Ask</b> shows a confirm first. <b style="color:var(--ink)">Never</b> keeps it to you.</p>
  <div class="sec-h"><h2 class="sec">Manual status</h2></div>
  <div class="list"><div class="set"><span class="sl"><div class="s1">Show my status to ${esc(p)}</div><div class="s2">Awake, Working, Home, Busy and so on. You set it yourself.</div></span>${tog('statusShare',u.sharing.status!=='never','Show my status')}</div></div>
  <div class="sec-h"><h2 class="sec">Always private</h2></div>
  <div class="list">${['Notes marked Only me','Reminders marked Only me','Events marked Only me','Alarms and routine','Anything set to Never'].map(t=>`<div class="pr">${ic('lock',18)}<span class="sl"><div class="s1">${t}</div></span><span class="chip">Only you</span></div>`).join('')}</div>
  <p class="hint" style="margin-top:10px">${esc(p)} can't see that these exist. Location is not tracked, and isn't part of this app.</p>
  <div class="sec-h"><h2 class="sec">Connection</h2></div>
  <button class="btn sec" data-a="go" data-v="relmode">Relationship mode</button>`};

SCR.sharing=()=>{const u=U(),p=nm(PID()),sh=u.sharing;
  const sel=(k,opts)=>`<select data-in="sharing" data-k="${k}" aria-label="${k}">${opts.map(([v,l])=>`<option value="${v}" ${sh[k]===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const seen=[];
  if(sh.work!=='never')seen.push(`Work ${sh.work==='busy'?'(busy only)':'hours'} ${fmtHM(u.workStart)} to ${fmtHM(u.workEnd)}`);
  if(sh.meetings!=='never')seen.push(sh.meetings==='busy'?'Meetings as “Busy”':'Meeting titles and times');
  if(sh.routineTimes!=='never')seen.push('Lunch, finish and gym times');
  seen.push('Status you set, and check-ins you share');
  return `${bar('Sharing settings')}
  <p class="sub" style="margin:0 0 12px">What ${esc(p)} can see on your schedule.</p>
  <div class="list">
   <div class="set"><span class="sl"><div class="s1">Work hours</div><div class="s2">Start and end of your workday</div></span>${sel('work',[['details','Show'],['busy','Busy only'],['never','Hide']])}</div>
   <div class="set"><span class="sl"><div class="s1">Meetings</div><div class="s2">Events you add as details</div></span>${sel('meetings',[['details','Show titles'],['busy','Busy only'],['never','Hide']])}</div>
   <div class="set"><span class="sl"><div class="s1">Routine times</div><div class="s2">Lunch, finish work, gym, sleep</div></span>${sel('routineTimes',[['always','Show'],['never','Hide']])}</div></div>
  <div class="sec-h"><h2 class="sec">What ${esc(p)} sees</h2></div>
  <div class="card them"><ul style="margin:0;padding:0 0 0 18px;display:grid;gap:6px">${seen.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
  <div class="sec-h"><h2 class="sec">${esc(p)} never sees</h2></div>
  <div class="card"><ul style="margin:0;padding:0 0 0 18px;display:grid;gap:6px;color:var(--ink-2)"><li>Personal notes</li><li>Private reminders</li><li>Events marked Private</li><li>Check-ins set to Never</li></ul></div>`};

SCR.notifset=()=>{const u=U(),p=nm(PID());
  const quiet=`<div class="sec-h"><h2 class="sec">Quiet hours</h2></div>
  <div class="list"><div class="set"><span class="sl"><div class="s1">Quiet hours</div><div class="s2">Updates wait. Alarms still ring.</div></span>${tog('qh',u.quiet.on,'Quiet hours')}</div>
  ${u.quiet.on?`<div class="set"><span class="sl"><div class="s1">From / until</div></span><input type="time" data-in="qfrom" value="${u.quiet.from}" aria-label="From"><input type="time" data-in="qto" value="${u.quiet.to}" aria-label="Until"></div>`:''}
  <div class="set"><span class="sl"><div class="s1">Do Not Disturb</div><div class="s2">Pause updates until you turn it off.</div></span>${tog('dnd',u.dnd,'Do not disturb')}</div></div>`;
  if(!isConn())return `${bar('Notification settings')}<p class="sub" style="margin:0 0 12px">Reminders and alarms only.${S.mode==='mingle'?` Updates from ${esc(p)} start once ${esc(p)} joins.`:''}</p>${quiet}`;
  const fr=u.freq||'balanced';
  return `${bar('Notification settings')}
  <p class="sub" style="margin:0 0 12px">How updates from ${esc(p)} reach you. Nothing is sent for every routine event.</p>
  <div class="seg">${[['important','Only important'],['balanced','Balanced'],['all','Everything']].map(([v,l])=>`<button data-a="freq" data-v="${v}" aria-pressed="${fr===v}">${l}</button>`).join('')}</div>
  <p style="font-size:13px;color:var(--ink-2);margin:8px 2px 0">${{important:'Only reminders, shared events and working late.',balanced:'Wake-ups and bedtimes too. Meals stay quiet.',all:'Every shared update, up to 6 alerts a day.'}[fr]}</p>
  <div class="sec-h"><h2 class="sec">Fine tune</h2></div>
  <div class="list">${RECV.map(([k,l])=>`<div class="set"><span class="sl"><div class="s1">${l}</div></span><select data-in="recv" data-k="${k}" aria-label="${l}"><option value="notify" ${u.recv[k]==='notify'?'selected':''}>Notify me</option><option value="quiet" ${u.recv[k]==='quiet'?'selected':''}>Quietly in Our Space</option><option value="off" ${u.recv[k]==='off'?'selected':''}>Don't show</option></select></div>`).join('')}</div>
  ${quiet}
  <p class="hint" style="margin-top:12px">Limit: at most 6 status alerts a day. Check-in prompts expire after 30 minutes without a reminder.</p>`};

SCR.settings=()=>{const s=S.set;return `${bar('Settings')}
  <div class="list"><div class="set"><span class="sl"><div class="s1">24-hour clock</div></span>${tog('h24',s.h24,'24-hour clock')}</div>
  <div class="set"><span class="sl"><div class="s1">Time zone</div></span><span class="chip">${esc(U().tz)}</span></div></div>

  <div class="list"><button class="pr" data-a="go" data-v="relmode"><span class="sl"><div class="s1">Relationship mode</div><div class="s2">${S.mode==='single'?'Single':'Mingle'}${S.archived?' · 1 archived space':''}</div></span><span class="chev">${ic('next',18)}</span></button>
  ${isConn()?`<button class="pr" data-a="go" data-v="sharing"><span class="sl"><div class="s1">Change what I share</div><div class="s2">Choose what ${esc(nm(PID()))} can see</div></span><span class="chev">${ic('next',18)}</span></button>
  <button class="pr" data-a="sheet" data-v="separate"><span class="sl"><div class="s1" style="color:var(--danger)">Break up with ${esc(nm(PID()))}…</div><div class="s2">Disconnect from each other</div></span><span class="chev">${ic('next',18)}</span></button>`
  :(S.pstate==='invited'?'':`<button class="pr" data-a="sheet" data-v="invite"><span class="sl"><div class="s1">Add a new partner</div><div class="s2">Connect with a new code</div></span><span class="chev">${ic('next',18)}</span></button>`)}</div>

  <div class="sec-h"><h2 class="sec">Account</h2></div>
  <div class="list"><div class="set"><span class="sl"><div class="s1">Email</div></span><span class="chip">${esc(U().contact||'Not set')}</span></div>
  <div class="set"><button class="sl" data-a="sheet" data-v="logout" style="text-align:left"><div class="s1" style="color:var(--danger)">Log out</div><div class="s2">Disconnects your partner and clears this phone.</div></button></div>
  <div class="set"><button class="sl" data-a="sheet" data-v="reset" style="text-align:left"><div class="s1" style="color:var(--danger)">Restart demo</div><div class="s2">Clears everything and starts onboarding.</div></button></div></div>
  <div class="sec-h"><h2 class="sec">Network</h2></div>
  <div class="list"><div class="set"><span class="sl"><div class="s1">Show offline state</div><div class="s2">Changes still work and sync later.</div></span>${tog('offline',ui.offline,'Offline')}</div></div>`};

SCR.partner=()=>{const p=PID(),u=U(p),st=statusOf(p),you=U();
  return `${bar(esc(nm(p)))}
  <div style="display:flex;align-items:center;gap:14px;padding:6px 0 16px"><span class="them">${av(p,68)}</span><div><h1 class="title" style="font-size:26px;margin:0">${esc(nm(p))}</h1><div class="sub" style="margin:2px 0 0">${st?`${st.emoji} ${esc(st.label)} · since ${fmtT(st.ts)}`:'No status right now'}</div></div></div>
  <div class="btns"><button class="btn them" data-a="add" data-v="remindp">${ic('send',20)}Remind ${esc(nm(p))}</button><button class="btn sec" data-a="tab" data-v="us">Open Us</button></div>
  <div class="sec-h"><h2 class="sec">${esc(nm(p))}'s day</h2></div>
  <div class="list">${u.sharing.routineTimes==='never'?`<div class="pr"><span class="sl"><div class="s1">${esc(nm(p))} isn't sharing routine times</div></span></div>`:routineList(p).filter(e=>['wake','work','lunch','workend','exercise','sleep'].includes(e.kind)).map(e=>`<div class="pr"><span class="rico" style="background:var(--them-soft)">${KEMOJI[e.kind]}</span><span class="sl"><div class="s1">${esc(e.label)}</div></span><b style="font-variant-numeric:tabular-nums">${fmtHM(e.time)}</b></div>`).join('')}</div>
  <div class="sec-h"><h2 class="sec">Time zone</h2></div>
  <div class="list"><div class="pr"><span class="sl"><div class="s1">${esc(u.tz)}</div><div class="s2">${u.tz===you.tz?'Same as yours':'Different from yours'}</div></span></div></div>
  <div class="sec-h"><h2 class="sec">What ${esc(nm(p))} sees of you</h2></div>
  <button class="pr" data-a="go" data-v="sharing"><span class="sl"><div class="s1">Sharing settings</div><div class="s2">Change what you share</div></span><span class="chev">${ic('next',18)}</span></button>`};

SCR.relmode=()=>{const p=nm(PID()),m=S.mode,st=S.pstate;
  const card=(v,t,sub,art)=>`<div class="mcard ${m===v?'on':''}"><div class="mart">${art}</div><div><b>${t}</b><span>${sub}</span></div></div>`;
  let panel='';
  if(m==='single'&&st!=='readonly')panel=`<div class="card" style="display:grid;gap:10px"><div style="font-weight:650">Switch to Mingle</div><div class="s2" style="font-size:13.5px;color:var(--ink-2)">Invite your partner. My Space stays exactly as it is, and nothing is shared until you both choose.</div><button class="btn them" data-a="sheet" data-v="invite">${ic('send',20)}Invite Partner</button></div>`;
  else if(m==='mingle'&&st==='none')panel=`<div class="card" style="display:grid;gap:10px"><div style="font-weight:650">No partner yet</div><button class="btn them" data-a="sheet" data-v="invite">${ic('send',20)}Invite Partner</button><button class="btn sec" data-a="tosingle">Switch to Single</button></div>`;
  else if(m==='mingle'&&st==='invited')panel=`<div class="card" style="display:grid;gap:10px"><div style="font-weight:650">Waiting for ${esc(p)}</div><div class="s2" style="font-size:13.5px;color:var(--ink-2)">${S.pair?'Your code: '+fmtCode(S.pair.code)+'. ':''}My Space works fully meanwhile.</div><div class="btns"><button class="btn sec" data-a="resend">Resend</button><button class="btn sec" data-a="cancelinv">Cancel invite</button></div></div>`;
  else if(isConn())panel=`<div class="card" style="display:grid;gap:10px"><div style="display:flex;gap:10px;align-items:center"><span class="avp">${av(V(),36)}${av(PID(),36)}</span><div><div style="font-weight:650">Connected with ${esc(p)}</div><div class="s2" style="font-size:13px;color:var(--ink-2)">Three spaces: yours, ${esc(p)}'s and Our Space</div></div></div></div>
    <button class="btn bad" style="margin-top:12px" data-a="sheet" data-v="separate">Break up with ${esc(p)}…</button>`;
  else if(st==='readonly')panel=`<div class="hint them"><b>Our Space is read-only.</b> Both of you can view it. It archives automatically in 30 days.</div><div class="btns" style="margin-top:10px"><button class="btn sec" data-a="exportdata">Export shared data</button><button class="btn sec" data-a="archivenow">Archive now</button></div><button class="btn sec" style="margin-top:8px" data-a="sheet" data-v="invite">Add a new partner</button>`;
  return `${bar('Relationship mode')}
  <p class="sub" style="margin:0 0 12px">Single is a complete app on its own. Mingle adds Our Space.</p>
  <div style="display:grid;gap:10px">${card('single','Single','My Space only',`<svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><path d="M78 68A34 34 0 1 1 78 32" fill="none" stroke="var(--you)" stroke-width="8" stroke-linecap="round"/><path d="M48 50L48 28" stroke="var(--you)" stroke-width="9" stroke-linecap="round"/></svg>`)}${card('mingle','Mingle','My Space + Our Space',`<svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><circle cx="38" cy="50" r="24" fill="none" stroke="var(--you)" stroke-width="8"/><circle cx="62" cy="50" r="24" fill="none" stroke="var(--them)" stroke-width="8"/></svg>`)}</div>
  <div style="margin-top:14px">${panel}</div>
  ${S.archived?`<div class="sec-h"><h2 class="sec">Archived</h2></div><div class="list"><div class="pr"><span class="sl"><div class="s1">${esc(S.archived.name)}</div><div class="s2">Archived ${dayLabel(S.archived.at)} · recoverable for 90 days</div></span><button class="link" data-a="exportdata">Export</button></div></div>`:''}`};
SCR.proto=()=>{
  const sup=pushSupported(),ios=isIOS(),sa=isStandalone();
  const st=S.pushOn?'on':(!sup?(ios&&!sa?'ios':'unsupported'):(Notification.permission==='denied'?'denied':'off'));
  const msg={on:'On. Alarms, reminders and partner updates reach you even when the app is closed.',ios:'On iPhone, first tap Share, then Add to Home Screen, and open the app from the new icon. Needs iOS 16.4 or newer.',unsupported:'This browser cannot receive notifications. Try Chrome on Android, or add the app to the Home Screen on iPhone.',denied:'Blocked. Allow notifications for this app in your phone settings, then come back.',off:'Turn them on to get alerts when the app is closed.'}[st];
  return `${bar('About this test build')}
  <div class="hint you"><b>You're testing an early version.</b> Thank you for trying it and telling us what feels good and what doesn't.</div>
  <div class="sec-h"><h2 class="sec">Notifications</h2></div>
  <div class="list"><div class="set"><span class="sl"><div class="s1">Alerts when the app is closed</div><div class="s2">${msg}</div></span>${st==='off'?`<button class="btn sm" data-a="enablepush">Turn on</button>`:''}</div>
  ${st==='on'?`<div class="set"><span class="sl"><div class="s1">Send a test notification</div></span><button class="btn sec sm" data-a="testpush">Test</button></div>`:''}</div>
  <div class="sec-h"><h2 class="sec">What works</h2></div>
  <div class="list">${['My Space: routine, reminders, events, notes, alarms','Mingle: pair two phones with a code, from anywhere','Shared items, status, check-ins and replies reach your partner, even if their phone is offline for a while','Notifications when the app is closed, once you turn them on','Privacy choices: Only me, Share with partner, Our Space'].map(t=>`<div class="pr">${ic('check',18)}<span class="sl"><div class="s1" style="font-weight:500">${t}</div></span></div>`).join('')}</div>
  <div class="sec-h"><h2 class="sec">Not yet</h2></div>
  <div class="list">${["An alarm that keeps ringing when the app is closed (you get a notification instead)","Backup if you clear the app's data","Private end-to-end encryption. Shared updates pass through a server, so avoid sensitive details"].map(t=>`<div class="pr">${ic('x',18)}<span class="sl"><div class="s1" style="font-weight:500">${t}</div></span></div>`).join('')}</div>
  <div class="sec-h"><h2 class="sec">Data</h2></div>
  <button class="btn bad" data-a="sheet" data-v="reset">Reset all data</button>`};

SCR.splash=()=>{if(!ui.splashTimer){ui.splashTimer=setTimeout(()=>{if(route[route.length-1].n==='splash'){route=[{n:'welcome'}];render()}},1600)}

SCR.welcome=()=>`<div class="flow"><div class="hero"><div>${MARK(52)}</div><h1>One clock for your day. Two, if you want.</h1><p class="lead">Notes, reminders, alarms and your schedule in My Space. Add a partner and you get Our Space too.</p></div>
  <div style="display:grid;gap:8px"><button class="btn" data-a="obgo" data-v="signup">Get started</button><p style="font-size:12.5px;color:var(--ink-2);text-align:center;margin:4px 0 0">Test build. Your data stays on this phone.</p></div></div>`;
SCR.signup=()=>`<div class="flow">${flowTop()}<div><h1>Let's set you up</h1><p class="lead">Just your name to start. Nothing leaves this phone in the test build.</p></div>
  <div style="display:grid;gap:12px">
  <label class="field"><span>Your name</span><input type="text" data-in="obname" value="${esc(ui.onb.name)}" placeholder="Your name" autocomplete="given-name"></label>
  <label class="field"><span>Email or phone (optional)</span><input type="text" data-in="obcontact" value="${esc(ui.onb.contact)}" placeholder="Optional" autocomplete="email"></label>
  <button class="btn" data-a="obnext">Continue</button></div></div>`;
SCR.login=()=>SCR.signup();
const MN=()=>S.users.lara.name||'You',PN=()=>S.users.sam.name||'Partner';
const modeCards=(sel,partnerName)=>`<div class="modes" role="radiogroup" aria-label="How are you using I Clock You?">
  <button class="modecard ${sel==='mingle'?'on':''}" role="radio" aria-checked="${sel==='mingle'}" data-a="modepick" data-v="mingle"><span class="mart mm">${artMingle}</span><span class="mtx"><b>Mingle</b><span>For couples who want to share their routines, schedules, reminders and daily life.</span><span class="mtags"><i>My Space</i><i class="t">+ Our Space</i></span></span><span class="radio"></span></button>
  <button class="modecard ${sel==='single'?'on':''}" role="radio" aria-checked="${sel==='single'}" data-a="modepick" data-v="single"><span class="mart ms">${artSingle}</span><span class="mtx"><b>Single</b><span>For managing your own notes, reminders, alarms, schedule and personal routines.</span><span class="mtags"><i>My Space</i></span></span><span class="radio"></span></button></div>`;
SCR.mode=()=>`<div class="flow">${flowTop()}<div><h1>How are you using I Clock You?</h1><p class="lead">Both get the full app. Mingle adds a shared space for the two of you.</p></div>
  ${modeCards(ui.onb.mode)}
  <p style="font-size:13px;color:var(--ink-2);margin:0;text-align:center">You can change this any time in Settings.</p>
  <div style="flex:1"></div><button class="btn" data-a="obnext" ${ui.onb.mode?'':'disabled style="opacity:.4"'}>Continue</button></div>`;
SCR.profile=()=>`<div class="flow">${flowTop(1)}<div><h1>A little about you</h1><p class="lead">Just the basics. You can change everything later.</p></div>
  <label class="field"><span>Your name</span><input type="text" data-in="obname" value="${esc(ui.onb.name)}"></label>
  <div class="field"><span>Age range</span><div class="chipsel">${['18–24','25–34','35–44','45+'].map(a=>`<button data-a="obage" data-v="${a}" aria-pressed="${ui.onb.age===a}">${a}</button>`).join('')}</div></div>
  <label class="field"><span>Time zone</span><select><option>Europe/Lisbon (detected)</option><option>Europe/London</option><option>America/New_York</option><option>Asia/Kolkata</option></select></label>
  <div style="flex:1"></div><button class="btn" data-a="obnext">Continue</button></div>`;
SCR.employment=()=>`<div class="flow">${flowTop(1)}<div><h1>What does your week look like?</h1><p class="lead">This sets your first check-ins.</p></div>
  <div class="chipsel">${['Working','Student','Homemaker','Other'].map(a=>`<button data-a="obemp" data-v="${a}" aria-pressed="${ui.onb.emp===a}">${a}</button>`).join('')}</div>
  <div class="field"><span>${ui.onb.emp==='Student'?'Study':'Work'} days</span><div class="dchips">${[1,2,3,4,5,6,0].map(d=>`<button data-a="obday" data-v="${d}" aria-pressed="${ui.onb.days.includes(d)}" aria-label="${WDL[d]}">${WD[d][0]}</button>`).join('')}</div></div>
  <div style="flex:1"></div><button class="btn" data-a="obnext">Continue</button></div>`;
SCR.workhours=()=>`<div class="flow">${flowTop(1)}<div><h1>Your ${ui.onb.emp==='Student'?'study':'work'} hours</h1><p class="lead">Used for “Time for work” and “Done for today?”.</p></div>
  <div class="card"><div class="tline"><label>Starts</label><input type="time" value="${S.users.lara.workStart}" data-in="obws"></div><div class="tline"><label>Ends</label><input type="time" value="${S.users.lara.workEnd}" data-in="obwe"></div></div>
  <div class="field"><span>Where do you work?</span><div class="chipsel">${['Office','Work from home','Hybrid'].map(a=>`<button data-a="obloc" data-v="${a}" aria-pressed="${ui.onb.loc===a}">${a}</button>`).join('')}</div></div>
  <div style="flex:1"></div><button class="btn" data-a="obnext">Continue</button></div>`;
SCR.routineSetup=()=>`<div class="flow">${flowTop(1)}<div><h1>Your daily rhythm</h1><p class="lead">Five times is enough to start. Add breaks and exercise later in Routine.</p></div>
  <div class="card">${['wake','breakfast','lunch','dinner','sleep'].map(k=>`<div class="tline"><label>${KEMOJI[k]} ${KLABEL[k]}</label><input type="time" data-in="rtime" data-k="${k}" data-u="lara" value="${S.users.lara.routine[k]}"></div>`).join('')}</div>
  <div style="flex:1"></div><button class="btn" data-a="obnext">Continue</button></div>`;
SCR.invite=()=>`<div class="flow">${flowTop(1)}<div><h1>Who do you want to Mingle with?</h1><p class="lead">Connect with a code. You can keep using My Space meanwhile.</p></div>
  <div class="card" style="display:grid;gap:10px"><div><b>Create a code</b><div class="s2" style="font-size:13.5px;color:var(--ink-2)">You get a code. Your partner types it in on their phone.</div></div><button class="btn them" data-a="linkhost">${ic('send',20)}Create a code</button></div>
  <div class="card" style="display:grid;gap:10px"><div><b>I have a code from my partner</b></div><div style="display:flex;gap:8px"><input type="text" id="codein" data-in="codein" value="${esc(ui.onb.codeIn||'')}" placeholder="K7Q4-XM9P" autocapitalize="characters" autocomplete="off" aria-label="Partner's code" style="letter-spacing:.08em"><button class="btn sm" data-a="linkjoin">Connect</button></div><div class="err" id="codeerr" role="alert">${esc(ui.onb.codeErr||'')}</div></div>
  <div style="flex:1"></div><button class="linkbtn" data-a="obskipinv">I'll do this later</button></div>`;
SCR.spaces=()=>{const mg=ui.onb.mode==='mingle',inv=S.pstate==='invited';
  return `<div class="flow"><div style="flex:1;display:grid;align-content:center;gap:18px"><div><h1>${mg?'Your spaces are ready':'My Space is ready'}</h1><p class="lead">${mg?'Two spaces, always clearly labelled.':'Everything you need for your day, in one place.'}</p></div>
  <div class="sp you"><span class="spi"><span class="avp">${av('lara',40)}</span></span><span><b>My Space</b><small>Mine. Notes, reminders, alarms, schedule, routine. Private by default.</small></span></div>
  ${mg?`<div class="sp them"><span class="spi">${inv?`<span class="av them ghost" style="--s:40px">${esc(PN()[0]||'P')}</span>`:`<span class="avp">${av('lara',40)}${av('sam',40)}</span>`}</span><span><b>Our Space</b><small>${inv?(S.pair&&S.pair.role==='host'?'Share your code. It starts when your partner joins.':S.pair?'Connecting with your partner.':'Waiting for '+esc(PN())+'.'):'Ours. Shared tasks, schedule and status, only what you both choose.'}</small></span></div>`:''}</div>
  <button class="btn" data-a="obfinish">Open My Space</button></div>`};
SCR.invited=()=>SCR.connected();
SCR.connected=()=>`<div class="flow" style="justify-content:center"><div class="phone2"><div style="display:flex;align-items:center"><span class="you">${av('lara',64)}</span><span class="them" style="margin-left:-12px">${av('sam',64)}</span></div><h1 style="text-align:center">${esc(PN())} joined</h1><p class="lead" style="max-width:34ch;text-align:center">${S.pair?'You are connected.':'Test build: '+esc(PN())+' is simulated on this phone.'} Three spaces now exist, and nobody sees anyone's private content.</p></div>
  <div style="display:grid;gap:10px"><div class="sp you"><span class="spi">${av('lara',36)}</span><span><b>${esc(MN())}'s My Space</b><small>Private to ${esc(MN())}</small></span></div><div class="sp them"><span class="spi">${av('sam',36)}</span><span><b>${esc(PN())}'s My Space</b><small>Private to ${esc(PN())}</small></span></div><div class="sp us"><span class="spi"><span class="avp">${av('lara',36)}${av('sam',36)}</span></span><span><b>${esc(MN())} &amp; ${esc(PN())}'s Our Space</b><small>Only what you both put here</small></span></div></div>
  ${pushSupported()&&!S.pushOn?`<button class="btn sec" data-a="enablepush">Turn on notifications</button>`:''}
  <button class="btn" data-a="obgo" data-v="sharePresets">Choose what to share</button></div>`;
SCR.sharePresets=()=>`<div class="flow"><div><h1>What would you like to share with ${esc(PN())}?</h1><p class="lead">You can change any of this, item by item, in Privacy.</p></div>
  <div style="display:grid;gap:10px">${[['essentials','Just the essentials','Wake up, sleep and working late. We ask each time.'],['everything','Everything','Share every check-in automatically.'],['nothing','Nothing yet','Keep it all to yourself. Our Space still works.']].map(([v,t,sub])=>`<button class="preset" data-a="obpreset" data-v="${v}" aria-pressed="${ui.onb.preset===v}"><span class="radio"></span><span><b>${t}</b><span>${sub}</span></span></button>`).join('')}</div>
  <div style="flex:1"></div><button class="btn" data-a="obconnect">Open Our Space</button></div>`;

/* ---------- sheets ---------- */
const SH={};
const KINDS=[['reminder','Reminder'],['event','Event'],['alarm','Alarm'],['note','Note']];
const optsRep=v=>[['none','Once'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week'],['monthly','Every month']].map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('');
function newDraft(kind){
  const n=new Date(NOW());n.setMinutes(0,0,0);n.setHours(n.getHours()+1);
  const d={kind,title:'',ptitle:'',body:'',date:dk(route[route.length-1].n==='plan'||tabOf()==='plan'?ui.sel:TODAY),time:m2hm(minOf(n.getTime())),rep:'none',pri:'normal',notes:'',dur:60,lead:'',vis3:isConn()?(U().defVis3||'me'):'me',doer:'me',evsub:'details',adays:[1,2,3,4,5],sound:'Sunrise',manual:{},firm:false};
  d.base={date:d.date,time:d.time};return d;
}
const pvHTML=d=>{
  if(d.kind!=='reminder')return'';
  const ts=mkTs(d.date,d.time||'00:00'),t=(d.ptitle||d.title).trim(),p=nm(PID());
  const who=d.vis3==='partner'?`<span class="chip c them">For ${esc(p)}</span>`:d.vis3==='ours'?'<span class="chip"><span class="sd"></span>Our Space</span>':`<span class="chip c you">${ic('lock',11)}Only me</span>`;
  return `${t?`<div class="pvt">Reminder: <b>${esc(cap(t))}</b></div>`:`<div class="pvt">Type what to remember. ${isConn()?'Who, when':'When'} and repeats are picked up as you type.</div>`}${who}<span class="chip">${ic('clock',12)}${dayLabel(ts)}, ${d.time?fmtT(ts):'anytime'}</span>${d.rep!=='none'?`<span class="chip">${ic('repeat',12)}${({daily:'Daily',weekdays:'Weekdays',weekly:'Weekly',monthly:'Monthly'})[d.rep]}</span>`:''}`;
};
function createHTML(){
  const {d,edit}=ui.sheet,k=d.kind,p=PID(),conn=isConn(),pick=S.mode!=='single'&&S.pstate!=='readonly'&&k!=='alarm'&&!edit;
  const toP=k==='reminder'&&d.vis3==='partner';
  const picker=pick?`<div class="field"><span>Who can see this?</span>${visPickerHTML(d.vis3,k,'vis3')}</div>`:'';
  let body='';
  if(k==='reminder')body=`<input type="text" class="big" id="f-title" data-in="title" placeholder="${conn?'Remind '+esc(nm(p))+' to buy groceries at 6 PM':'Pay electricity bill tomorrow at 10 AM'}" value="${esc(d.title)}" autocomplete="off" aria-label="What to remember" enterkeyhint="done">
   <div class="pv" id="pv" aria-live="polite">${pvHTML(d)}</div>
   <div class="qt"><button data-a="qt" data-v="later">Later today</button><button data-a="qt" data-v="tonight">Tonight</button><button data-a="qt" data-v="tom">Tomorrow 9 AM</button><button data-a="qt" data-v="mon">Next Monday</button></div>
   <div class="grid2"><label class="field"><span>Date</span><input type="date" id="f-date" data-in="date" value="${d.date}"></label><label class="field"><span>Time</span><input type="time" id="f-time" data-in="time" value="${d.time}"></label></div>
   <div class="grid2"><label class="field"><span>Repeat</span><select id="f-rep" data-in="rep">${optsRep(d.rep)}</select></label><label class="field"><span>Priority</span><select data-in="pri"><option value="normal" ${d.pri==='normal'?'selected':''}>Normal</option><option value="high" ${d.pri==='high'?'selected':''}>High</option></select></label></div>
   ${picker}
   ${d.vis3==='ours'?`<div class="field"><span>Who's on it?</span><div class="who"><button class="you" aria-pressed="${d.doer==='me'}" data-a="doer" data-v="me">${av(V(),32)}Me</button><button class="them" aria-pressed="${d.doer==='partner'}" data-a="doer" data-v="partner">${av(p,32)}${esc(nm(p))}</button></div></div>`:''}
   ${toP?`<div class="hint them" id="hint">${esc(nm(p))} gets a notification and can mark it Done, Snooze it, Reschedule or Decline. You'll see what ${esc(nm(p))} chooses.</div><label class="set" style="padding:0"><span class="sl"><div class="s1">Firm deadline</div><div class="s2">${esc(nm(p))} can only propose a new time.</div></span>${tog('firm',d.firm,'Firm deadline')}</label>`:`<label class="field"><span>Note (optional)</span><input type="text" data-in="notes" placeholder="Details" value="${esc(d.notes)}"></label>`}`;
  if(k==='event')body=`<input type="text" class="big" id="f-title" data-in="title" placeholder="Event title" value="${esc(d.title)}" autocomplete="off" aria-label="Event title">
   <div class="grid2"><label class="field"><span>Date</span><input type="date" id="f-date" data-in="date" value="${d.date}"></label><label class="field"><span>Starts</span><input type="time" id="f-time" data-in="time" value="${d.time}"></label></div>
   <div class="grid2"><label class="field"><span>Length</span><select data-in="dur">${[[30,'30 min'],[45,'45 min'],[60,'1 hour'],[90,'1.5 hours'],[120,'2 hours'],[240,'4 hours']].map(([v,l])=>`<option value="${v}" ${+d.dur===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field"><span>Remind</span><select data-in="lead"><option value="">No reminder</option><option value="15" ${d.lead==='15'?'selected':''}>15 min before</option><option value="30" ${d.lead==='30'?'selected':''}>30 min before</option><option value="60" ${d.lead==='60'?'selected':''}>1 hour before</option></select></label></div>
   ${picker}
   ${d.vis3==='partner'?`<div class="field"><span>${esc(nm(p))} sees</span>${seg('evsub',d.evsub,[['busy','Busy only'],['details','Details']])}</div>`:''}`;
  if(k==='note')body=`<input type="text" class="big" id="f-title" data-in="title" placeholder="Title" value="${esc(d.title)}" autocomplete="off" aria-label="Note title">
   <textarea id="f-body" data-in="body" rows="5" placeholder="${d.vis3==='ours'?'Milk\nBread\nEggs':'Start typing…'}" aria-label="Note">${esc(d.body)}</textarea>
   ${d.vis3==='ours'?`<div class="hint them">Our Space notes are checklists. Add one item per line. ${esc(nm(p))} can add and tick items.</div>`:''}
   ${picker}`;
  if(k==='alarm')body=`<label class="field"><span>Time</span><input type="time" id="f-time" data-in="time" value="${d.time}" style="font:600 44px/1 var(--f-display);min-height:84px;text-align:center"></label>
   <div id="ringsin" class="pvt" style="text-align:center"></div>
   <label class="field"><span>Label</span><input type="text" id="f-title" data-in="title" placeholder="Wake up" value="${esc(d.title)}" autocomplete="off"></label>
   <div class="field"><span>Repeat on</span><div class="dchips">${[1,2,3,4,5,6,0].map(x=>`<button data-a="aday" data-v="${x}" aria-pressed="${d.adays.includes(x)}" aria-label="${WDL[x]}">${WD[x][0]}</button>`).join('')}</div></div>
   <label class="field"><span>Sound</span><select data-in="sound">${['Sunrise','Chime','Pulse','Birds'].map(s=>`<option ${d.sound===s?'selected':''}>${s}</option>`).join('')}</select></label>
   <div class="hint you" style="display:flex;gap:8px;align-items:center">${ic('lock',16)}<span>Alarms are always only yours.</span></div>`;
  const cta={reminder:toP?`${ic('send',20)}Send to ${esc(nm(p))}`:d.vis3==='ours'?'Add to Our Space':edit?'Save changes':'Set reminder',event:d.vis3==='ours'?'Add to Our Space':d.vis3==='partner'?`Save and share with ${esc(nm(p))}`:'Save event',alarm:'Save alarm',note:d.vis3==='ours'?'Save to Our Space':'Save note'}[k];
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Add">
   <div class="grab"></div>${edit?`<h2>Edit ${k}</h2>`:`<div class="seg" role="group" aria-label="What are you adding?">${KINDS.map(([v,l])=>`<button data-a="kind" data-v="${v}" aria-pressed="${k===v}">${l}</button>`).join('')}</div>`}
   ${body}<div class="err" id="f-err" role="alert"></div><button class="btn ${toP||d.vis3==='ours'?'them':''}" data-a="save">${cta}</button></div>`;
}
SH.create=createHTML;
SH.invite=()=>{const s=ui.sheet;return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Connect with a code"><div class="grab"></div><h2>Who do you want to Mingle with?</h2><p class="sub2">Connect with a code. Nothing is shared until you choose, and My Space stays yours.</p>
  <div class="card" style="display:grid;gap:10px"><div><b>Create a code</b><div class="s2" style="font-size:13.5px;color:var(--ink-2)">Your partner types it in on their phone.</div></div><button class="btn them" data-a="linkhost">${ic('send',20)}Create a code</button></div>
  <div class="card" style="display:grid;gap:10px"><b>I have a code from my partner</b><div style="display:flex;gap:8px"><input type="text" id="codein" data-in="codein" value="${esc(s.codeIn||'')}" placeholder="K7Q4-XM9P" autocapitalize="characters" autocomplete="off" aria-label="Partner's code" style="letter-spacing:.08em"><button class="btn sm" data-a="linkjoin">Connect</button></div><div class="err" id="codeerr" role="alert">${esc(ui.codeErr||'')}</div></div></div>`};
SH.separate=()=>{const s=ui.sheet,p=nm(PID());
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Break up"><div class="grab"></div><h2>Break up with ${esc(p)}?</h2>
  <div class="hint you">You and ${esc(p)} will be disconnected and nothing new is shared. Your My Space stays yours. ${esc(p)}'s stays theirs. Afterwards you can add a new partner.</div>
  <div class="field"><span>What happens to Our Space</span><div class="opts"><button class="opt" aria-pressed="${s.opt==='readonly'}" data-a="sepopt" data-v="readonly"><span style="flex:1;text-align:left"><b>Keep it read-only</b><br><small style="color:var(--ink-2);font-weight:500">You both can view. Nobody edits. Archives in 30 days.</small></span></button><button class="opt" aria-pressed="${s.opt==='archive'}" data-a="sepopt" data-v="archive"><span style="flex:1;text-align:left"><b>Archive it now</b><br><small style="color:var(--ink-2);font-weight:500">Hidden. Recoverable and exportable for 90 days.</small></span></button></div></div>
  <label class="set" style="padding:0"><span class="sl"><div class="s1">Export a copy of shared data first</div><div class="s2">Notes, tasks, events as a file</div></span>${tog('sepexport',s.exp,'Export first')}</label>
  <button class="btn bad" data-a="sepgo">Break up and disconnect</button><button class="btn sec" data-a="close">Keep connected</button></div>`};
SH.vis=()=>{return ''};
SH.snooze=()=>{const {id,k}=ui.sheet,now=NOW();const opt=(l,s,v)=>`<button class="opt" data-a="snzdo" data-v="${v}" data-id="${id}" data-k="${k}">${l}<small>${s}</small></button>`;
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Snooze"><div class="grab"></div><h2>Snooze until…</h2><div class="opts">${opt('In 10 minutes',fmtT(now+6e5),'10')}${opt('In 1 hour',fmtT(now+36e5),'60')}${S.clock<18*60?opt('This evening','6:00 PM','eve'):''}${opt('Tomorrow morning','9:00 AM','tom')}<button class="opt" data-a="rsc" data-id="${id}" data-k="${k}">Pick a date and time<span style="margin-left:auto">${ic('next',18)}</span></button></div></div>`};
SH.resched=()=>{const {id,k,rd}=ui.sheet,r=REM(id),incoming=r.by!==r.for&&r.for===V();
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Reschedule"><div class="grab"></div><h2>${r.firm&&incoming?'Propose another time':'Move to another time'}</h2>
  <div class="grid2"><label class="field"><span>Date</span><input type="date" data-in="rdate" value="${rd.date}"></label><label class="field"><span>Time</span><input type="time" data-in="rtimeR" value="${rd.time}"></label></div>
  ${incoming?`<label class="field"><span>Message to ${esc(nm(r.by))} (optional)</span><input type="text" data-in="rmsg" placeholder="Can we do it a bit later?" value="${esc(rd.msg)}"></label><div class="hint them">${r.firm?`${esc(nm(r.by))} set a firm deadline, so this is a proposal.`:`${esc(nm(r.by))} is told the new time.`}</div>`:''}
  <div class="err" id="f-err" role="alert"></div><button class="btn ${incoming?'them':''}" data-a="rscdo">${r.firm&&incoming?'Send proposal':'Move it'}</button></div>`};
SH.decline=()=>{const {id,reason}=ui.sheet,r=REM(id);
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Decline"><div class="grab"></div><h2>Decline “${esc(r.title)}”?</h2><p class="sub2">${esc(nm(r.by))} will be told. Pick a reason.</p>
  <div class="opts">${['Can’t do it','Not me','Too busy right now'].map(x=>`<button class="opt" aria-pressed="${reason===x}" data-a="reason" data-v="${esc(x)}">${x}</button>`).join('')}</div><button class="btn bad" data-a="dcldo">Decline</button></div>`};

/* ---------- quick-add parsing ---------- */
const DOWRE='sunday|monday|tuesday|wednesday|thursday|friday|saturday';
function parseQuick(d){
  let s=' '+d.title+' ';const man=d.manual,R={date:d.base.date,time:d.base.time,rep:'none',for:V()};
  let fT=false,fD=false,fW=false;const p=PID();
  let m=s.match(/^\s*(?:remind|ask|tell)\s+(me|[a-z]+)\b/i);
  if(m){const n=m[1].toLowerCase();if(n==='me'){s=s.replace(m[0],' ');fW=true;R.for=V()}else if(isConn()&&n===nm(p).toLowerCase()){s=s.replace(m[0],' ');fW=true;R.for=p}}
  m=s.match(/\b(?:every\s+(day|weekday|weekdays|week|month|(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday))|(daily|weekly|monthly|weekdays))\b/i);
  if(m){const w=(m[1]||m[2]).toLowerCase();R.rep=w==='day'||w==='daily'?'daily':/weekday/.test(w)?'weekdays':w==='month'||w==='monthly'?'monthly':'weekly';const wi=WDL.map(x=>x.toLowerCase()).indexOf(w);if(wi>=0){const add=((wi-new Date(TODAY).getDay())+7)%7;R.date=dk(TODAY+add*DAY);fD=true}s=s.replace(m[0],' ')}
  m=s.match(/\bin\s+(\d+)\s*(min|mins|minutes|hour|hours|hr|h)\b/i);
  if(m){const t=new Date(NOW()+ +m[1]*(/^m/i.test(m[2])?6e4:36e5));R.date=dk(t);R.time=m2hm(minOf(t.getTime()));fD=fT=true;s=s.replace(m[0],' ')}
  m=s.match(/\b(today|tonight|tomorrow|this evening|this morning)\b/i);
  if(m){const w=m[1].toLowerCase();R.date=dk(TODAY+(w==='tomorrow'?DAY:0));fD=true;if(!fT){if(w==='tonight'||w==='this evening'){R.time='20:00';fT=true}else if(w==='this morning'){R.time='09:00';fT=true}}s=s.replace(m[0],' ')}
  else{m=s.match(new RegExp('\\b(?:on\\s+|next\\s+)?('+DOWRE+')\\b','i'));if(m&&!fD){const wi=WDL.map(x=>x.toLowerCase()).indexOf(m[1].toLowerCase());const add=((wi-new Date(TODAY).getDay())+7)%7||7;R.date=dk(TODAY+add*DAY);fD=true;s=s.replace(m[0],' ')}}
  m=s.match(/\b(?:at|by|@)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?![\d:])/i)||s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(m&&!fT){let h=+m[1];const mi=+(m[2]||0),ap=(m[3]||'').toLowerCase();if(h<=24&&mi<60){if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;if(!ap&&h>=1&&h<=6)h+=12;R.time=pad(h%24)+':'+pad(mi);fT=true;s=s.replace(m[0],' ')}}
  else if(/\bevening\b/i.test(s)&&!fT){R.time='18:00';fT=true;s=s.replace(/\bevening\b/i,' ')}
  if(fD&&!fT)R.time='09:00';
  if(fT&&!fD)R.date=mkTs(dk(TODAY),R.time)>NOW()?dk(TODAY):dk(TODAY+DAY);
  d.ptitle=s.replace(/\s+/g,' ').trim().replace(/^(?:to|that|about|:)\s+/i,'').replace(/\s+(?:to|at|on|by|for|and|,)$/i,'').replace(/[.,:;]+$/,'').trim();
  if(!man.date)d.date=R.date;if(!man.time)d.time=R.time;if(!man.rep)d.rep=R.rep;if(!man.vis3){d.vis3=(fW&&R.for===p&&isConn())?'partner':(d.vis3==='partner'?'me':d.vis3)}
}
function syncFields(){const d=ui.sheet.d,g=id=>root.querySelector('#'+id);if(g('f-date'))g('f-date').value=d.date;if(g('f-time'))g('f-time').value=d.time;if(g('f-rep'))g('f-rep').value=d.rep;const pv=g('pv');if(pv)pv.innerHTML=pvHTML(d)}
function refreshCreate(){const y=$('.sheet')?.scrollTop||0;$('#layer').innerHTML=createHTML();const s=$('.sheet');if(s)s.scrollTop=y}
function ringsIn(){const el=$('#ringsin'),d=ui.sheet?.d;if(!el||!d)return;const m=hm2m(d.time||'07:00');let best=null;for(let i=0;i<8;i++){const dt=new Date(TODAY+i*DAY);dt.setHours(Math.floor(m/60),m%60,0,0);if(dt.getTime()<=NOW())continue;if(!d.adays.length||d.adays.includes(dt.getDay())){best=dt.getTime();break}}el.textContent=best?'Rings in '+inTxt(best-NOW()):''}
const showErr=m=>{const e=$('#f-err');if(e)e.textContent=m};
function saveDraft(){
  const d=ui.sheet.d,edit=ui.sheet.edit,p=PID(),conn=isConn();
  const v=conn?d.vis3:'me';
  if(d.kind==='note'){
    if(!d.title.trim()&&!d.body.trim())return showErr('Write something first.');
    const items=v==='ours'?d.body.split('\n').map(x=>x.trim()).filter(Boolean).map(t=>({t,d:0})):[];
    const n={id:uid('n'),owner:V(),title:d.title.trim(),vis:v,body:v==='ours'?'':d.body,items,upd:NOW(),by:V()};S.notes.unshift(n);ui.sheet=null;ui.noteTab=v==='me'?'mine':'ours';tab('notes');commit();toast(v==='ours'?'Saved to Our Space':v==='partner'?`Shared with ${nm(p)} (view only)`:'Note saved. Only you can see it.',()=>{S.notes=S.notes.filter(x=>x!==n);commit()});return;
  }
  if(d.kind==='alarm'){
    if(!d.time)return showErr('Choose a time.');
    if(edit){Object.assign(S.alarms.find(x=>x.id===edit),{time:d.time,label:d.title||'Alarm',days:[...d.adays],sound:d.sound,on:true})}else S.alarms.push({id:uid('a'),user:V(),time:d.time,label:d.title||'Alarm',days:[...d.adays],on:true,sound:d.sound});
    ui.sheet=null;commit();toast('Alarm saved');return;
  }
  const title=(d.kind==='reminder'?(d.ptitle||d.title):d.title).trim();
  if(!title)return showErr(d.kind==='event'?'Give the event a title.':'Add what to remember.');
  const ts=mkTs(d.date,d.time||'00:00');
  if(d.kind==='reminder'&&d.rep==='none'&&ts<NOW()-6e4&&!edit)return showErr('That time has passed. Pick a later time.');
  if(d.kind==='event'){
    const e={id:uid('e'),title:cap(title),owner:v==='ours'?'us':V(),at:ts,dur:+d.dur,rep:d.rep,vis:v==='ours'?'details':v==='partner'?d.evsub:'private',lead:d.lead?+d.lead:null};
    S.events.push(e);ui.sheet=null;commit();toast(v==='ours'?'Added to Our Space':v==='partner'?`Shared with ${nm(p)}`:'Event saved. Only you can see it.',()=>{S.events=S.events.filter(x=>x!==e);commit()});return;
  }
  const forWho=v==='partner'?p:(v==='ours'&&d.doer==='partner'?p:V());
  const f={title:cap(title),at:ts,rep:d.rep,pri:d.pri,notes:d.notes,for:forWho,firm:d.firm&&v==='partner'};
  if(edit){const r=REM(edit);Object.assign(r,f);r.moved={};stamp(r,'Edited');ui.sheet=null;back();commit();toast('Saved');return}
  const r={id:uid('r'),by:V(),joint:v==='ours',status:v==='partner'?'sent':null,done:{},moved:{},log:[],...f};
  if(v==='partner')r.log.push({t:NOW(),text:`You sent this to ${nm(p)}`});
  S.rems.push(r);ui.sheet=null;commit();
  toast(v==='partner'?`Sent to ${nm(p)}. You'll see what they choose.`:v==='ours'?'Added to Our Space':'Reminder set for '+whenTxt(r.at)+'. Only you can see it.',()=>{S.rems=S.rems.filter(x=>x!==r);commit()});
}

  if(kind==='remindp'){d.vis3='partner';d.manual.vis3=1}

function applyVis(kind,id,v){
  const p=PID(),snap=JSON.stringify(S);
  if(kind==='rem'){const r=REM(id);if(v==='me'){r.for=V();r.joint=false;r.status=null}else if(v==='partner'){r.for=p;r.joint=false;r.status='sent';stamp(r,`You sent this to ${nm(p)}`)}else{r.joint=true;r.status=null;if(r.for===p&&r.by===p)r.for=p}}
  else if(kind==='note'){const n=S.notes.find(x=>x.id===id);n.vis=v;if(v==='ours'&&!n.items.length){n.items=n.body.split('\n').filter(x=>x.trim()).map(t=>({t:t.trim(),d:0}));n.body=''}}

  commit();toast({me:'Now only you can see this.',partner:`Shared with ${nm(p)}.`,ours:'Moved to Our Space.'}[v],()=>{S=JSON.parse(snap);commit()});
}
